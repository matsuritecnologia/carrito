
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Tecnológico - Colegio San Lucas</title>
    <!-- Librería MQTT por WebSockets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #0f172a; 
            color: white; 
            margin: 0;
            padding: 20px 10px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Encabezado e Insignia */
        .header {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            max-width: 450px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }

        .logo-colegio {
            width: 110px;
            height: auto;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 20px;
            margin: 5px 0;
            color: #f8fafc;
        }

        h2 {
            font-size: 14px;
            margin: 0;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtext {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

        /* Estado de Conexión */
        .status-box {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            background: #334155;
        }

        .online { color: #4ade80; }
        .offline { color: #f87171; }

        /* Panel de Control */
        .grid { 
            display: inline-grid; 
            grid-template-columns: repeat(3, 95px); 
            gap: 15px; 
            background: #1e293b;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }

        button { 
            width: 95px; 
            height: 95px; 
            font-size: 32px; 
            border: none; 
            border-radius: 16px; 
            background: #2563eb; 
            color: white; 
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #1d4ed8;
        }

        button:active { 
            transform: translateY(4px); 
            box-shadow: 0 0 0 #1d4ed8;
            background: #1d4ed8;
        }

        .stop { 
            background: #dc2626; 
            box-shadow: 0 4px 0 #b91c1c;
        }

        .stop:active { 
            background: #b91c1c; 
            box-shadow: 0 0 0 #b91c1c;
        }

        .empty { visibility: hidden; }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <!-- Encabezado Institucional -->
    <div class="header">
        <!-- Logo del Colegio San Lucas (Lo Espejo) -->
        <img src="https://www.colegiosanlucas.com/wp-content/uploads/2021/04/logo-san-lucas.png" alt="Logo Colegio San Lucas" class="logo-colegio" onerror="this.src='https://www.colegiosanlucas.com/wp-content/uploads/2020/05/logo_san_lucas.png'">
        <h1>Colegio San Lucas</h1>
        <h2>Proyecto Tecnológico - 1° Medio</h2>
        <div class="subtext">Comuna de Lo Espejo | Control Remoto MQTT</div>
    </div>

    <!-- Indicador de Conexión -->
    <div id="estado" class="status-box offline">Estado: Desconectado del Broker</div>

    <br>

    <!-- Control de Botones -->
    <div class="grid">
        <div class="empty"></div>
        <button onclick="enviarMQTT('adelante')">▲</button>
        <div class="empty"></div>

        <button onclick="enviarMQTT('izquierda')">◄</button>
        <button class="stop" onclick="enviarMQTT('parar')">■</button>
        <button onclick="enviarMQTT('derecha')">►</button>

        <div class="empty"></div>
        <button onclick="enviarMQTT('atras')">▼</button>
        <div class="empty"></div>
    </div>

    <div class="footer">
        Vehículo Autónomo controlado vía Internet
    </div>

    <script>
        const topic = "carrito/control/nelson123";
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_client_" + parseInt(Math.random() * 1000, 10));

        client.onConnectionLost = function(responseObject) {
            document.getElementById('estado').innerText = "Estado: Conexión perdida";
            document.getElementById('estado').className = "status-box offline";
        };

        client.connect({
            useSSL: true,
            onSuccess: function() {
                document.getElementById('estado').innerText = "Estado: Conectado (Online)";
                document.getElementById('estado').className = "status-box online";
            },
            onFailure: function(err) {
                document.getElementById('estado').innerText = "Error de conexión: " + err.errorMessage;
            }
        });

        function enviarMQTT(comando) {
            if (client.isConnected()) {
                const message = new Paho.MQTT.Message(comando);
                message.destinationName = topic;
                client.send(message);
            }
        }

        // Teclado para PC
        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case "ArrowUp": enviarMQTT('adelante'); break;
                case "ArrowDown": enviarMQTT('atras'); break;
                case "ArrowLeft": enviarMQTT('izquierda'); break;
                case "ArrowRight": enviarMQTT('derecha'); break;
                case " ": enviarMQTT('parar'); break;
            }
        });
    </script>
</body>
</html>
